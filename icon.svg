<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Dynamic Pulse & Payment Flow Waves -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Payment Card Silhouette -->
    <rect x="40" y="80" width="432" height="270" rx="36" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="12" />
    <!-- Magnetic / Chip Accent -->
    <rect x="84" y="140" width="70" height="50" rx="12" fill="#f59e0b" opacity="0.9" />
    <!-- Streamlines / Pulse wave -->
    <path d="M 84 260 C 160 220, 220 300, 310 240 C 370 200, 410 250, 430 230" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Rising Growth Arrow -->
    <path d="M 330 140 L 410 140 L 410 220" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 270 280 L 406 144" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
